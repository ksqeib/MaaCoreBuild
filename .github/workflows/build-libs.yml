name: Build libs bundle

# Build and publish the build-only static libraries (Boost.Regex + zlib).
# This is intentionally separate from nightly.yml: it only needs to run when
# Boost / zlib / the MSVC toolchain changes, not on every MaaCore commit.

on:
  workflow_dispatch:
    inputs:
      bundleVersion:
        description: "Bundle version, e.g. v1 (bump when Boost/zlib/toolset changes)"
        required: true
        default: v1
        type: string
  push:
    tags:
      - "build-libs-v*"

permissions:
  contents: write

jobs:
  build-libs:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve bundle version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.bundleVersion }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}" -replace '^build-libs-', ''
            }
            else {
              $version = "v1"
            }
          }
          $version = $version.Trim()
          if ($version -notmatch '^v[0-9]+$') {
            throw "Invalid bundle version '$version'; expected something like v1."
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Bundle version: $version"

      - name: Cache upstream sources
        uses: actions/cache@v4
        with:
          path: .bootstrap/upstream-deps
          key: build-libs-sources-${{ runner.os }}-${{ hashFiles('tools/deps-versions.json') }}
          restore-keys: |
            build-libs-sources-${{ runner.os }}-

      - name: Build Boost.Regex and zlib
        shell: pwsh
        run: |
          .\tools\build-upstream-deps.ps1 `
            -OnlyBuildLibs `
            -Full `
            -DepsDir "$env:RUNNER_TEMP\build-libs-deps"

      - name: Pack build-libs bundle
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\pack-build-libs.ps1 `
            -DepsDir "$env:RUNNER_TEMP\build-libs-deps" `
            -BundleVersion "${{ steps.version.outputs.value }}" `
            -OutputDir "$env:GITHUB_WORKSPACE\dist" `
            -UpdateManifest

      - name: Publish release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "build-libs-$version"
          $asset = Get-ChildItem -Path dist -File -Filter "MaaCore-build-libs-*.zip" | Select-Object -First 1
          if ($null -eq $asset) { throw "No build-libs asset found in dist/" }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "MaaCore build libs $version" --notes "Prebuilt Boost.Regex + zlib for MaaCore build machines. Not part of the SDK."
          }
          gh release upload $tag $asset.FullName --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-libs-${{ steps.version.outputs.value }}
          path: |
            dist/MaaCore-build-libs-*.zip
            tools/build-libs-manifest.json
          if-no-files-found: error

      - name: Summary
        shell: pwsh
        run: |
          Write-Host "Published build-libs-${{ steps.version.outputs.value }}."
          Write-Host "Commit tools/build-libs-manifest.json so bootstrap/nightly pick it up."
          Get-Content tools/build-libs-manifest.json
