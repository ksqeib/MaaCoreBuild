name: Nightly MaaCore SDK

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "MaaCore upstream ref (default: upstream-sync)"
        required: false
        default: upstream-sync
        type: string
      force:
        description: "Force a nightly build even if nothing changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  nightly:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      MAA_REF: ${{ inputs.ref || 'upstream-sync' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for changes
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $force = "${{ inputs.force }}" -eq "true"
          $upstream = ((& git ls-remote https://github.com/ksqeib/MaaCore.git refs/heads/upstream-sync) -split '\s+')[0]
          if ([string]::IsNullOrWhiteSpace($upstream)) { throw "Could not resolve upstream-sync" }

          $versions = Get-Content tools/deps-versions.json -Raw | ConvertFrom-Json
          $maaUtilsRef = [string]$versions.dependencies.maautils.ref
          $maaUtilsCommit = [string]$versions.dependencies.maautils.commit
          if (-not [string]::IsNullOrWhiteSpace($maaUtilsRef)) {
            $maaUtils = ((& git ls-remote https://github.com/MaaXYZ/MaaUtils.git "refs/heads/$maaUtilsRef") -split '\s+')[0]
          }
          else {
            $maaUtils = $maaUtilsCommit
          }
          if ([string]::IsNullOrWhiteSpace($maaUtils)) { throw "Could not resolve MaaUtils commit" }

          $buildCommit = "${{ github.sha }}"
          $lastUpstream = ""
          $lastMaaUtils = ""
          $lastBuild = ""
          $body = ""
          $releaseJson = gh release view nightly --json body 2>$null
          # "release not found" is expected on the first run; do not let its exit code fail the step.
          $LASTEXITCODE = 0
          if (-not [string]::IsNullOrWhiteSpace($releaseJson)) {
            try {
              $body = [string](($releaseJson | ConvertFrom-Json).body)
            }
            catch {
              $body = ""
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($body)) {
            if ($body -match 'upstream-commit=([0-9a-f]+)') { $lastUpstream = $Matches[1] }
            if ($body -match 'maa-utils-commit=([0-9a-f]+)') { $lastMaaUtils = $Matches[1] }
            if ($body -match 'build-commit=([0-9a-f]+)') { $lastBuild = $Matches[1] }
          }

          $skip = (-not $force) -and ($lastUpstream -eq $upstream) -and ($lastMaaUtils -eq $maaUtils) -and ($lastBuild -eq $buildCommit)
          Write-Host "upstream:   $upstream (last: $lastUpstream)"
          Write-Host "MaaUtils:   $maaUtils (last: $lastMaaUtils)"
          Write-Host "build repo: $buildCommit (last: $lastBuild)"
          Write-Host "skip:       $skip"

          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "upstream=$upstream" >> $env:GITHUB_OUTPUT
          "maaUtils=$maaUtils" >> $env:GITHUB_OUTPUT
          "buildCommit=$buildCommit" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Setup sccache
        id: sccache
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Detect sccache
        id: sccache-check
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            "available=true" >> $env:GITHUB_OUTPUT
            sccache --version
          }
          else {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "sccache is not available; building without it."
          }

      - name: Ensure 7-Zip
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }

      - name: Cache sccache
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-nightly-${{ runner.os }}-${{ hashFiles('overlay/**', 'include/**', 'cmake/**', 'tools/**', '.github/workflows/nightly.yml') }}
          restore-keys: |
            sccache-nightly-${{ runner.os }}-

      - name: Cache prebuilt dependencies
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .work/MaaCore/deps
          key: maacore-deps-${{ runner.os }}-release-${{ hashFiles('tools/deps-versions.json', 'tools/fastdeploy-manifest.json', 'tools/build-upstream-deps.ps1', 'tools/fetch-deps.ps1', 'overlay/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            maacore-deps-${{ runner.os }}-release-

      - name: Cache upstream downloads
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .work/MaaCore/.bootstrap
          key: upstream-deps-downloads-${{ runner.os }}-${{ hashFiles('tools/build-upstream-deps.ps1', 'tools/deps-versions.json', 'tools/fastdeploy-manifest.json') }}
          restore-keys: |
            upstream-deps-downloads-${{ runner.os }}-

      - name: Prepare upstream source
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\prepare-source.ps1 `
            -Ref "$env:MAA_REF" `
            -MaaCoreCommit "${{ steps.check.outputs.upstream }}" `
            -MaaUtilsCommit "${{ steps.check.outputs.maaUtils }}"

      - name: Resolve nightly version
        if: steps.check.outputs.skip != 'true'
        id: version
        shell: pwsh
        run: |
          $sha = "${{ steps.check.outputs.upstream }}".Substring(0, 7)
          $version = "nightly-$(Get-Date -Format yyyyMMdd)-$sha"
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Nightly version: $version"

      - name: Bootstrap dependencies
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        working-directory: .work/MaaCore
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\bootstrap-standalone.ps1 -ReleaseOnly

      - name: Build MaaCore
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        working-directory: .work/MaaCore
        run: |
          $buildArgs = @(
            "-SkipBootstrap", "-NoFresh", "-Config", "RelWithDebInfo",
            "-Generator", "Ninja Multi-Config",
            "-Parallel", ([Environment]::ProcessorCount),
            "-Version", "${{ steps.version.outputs.value }}"
          )
          if ("${{ steps.sccache-check.outputs.available }}" -eq "true") {
            sccache --zero-stats
            $buildArgs += "-UseSccache"
          }
          powershell -ExecutionPolicy Bypass -File .\tools\build-maacore-only.ps1 @buildArgs

      - name: Show sccache stats
        if: always() && steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          }
          else {
            Write-Host "sccache is not available; skipping stats."
          }

      - name: Package nightly SDK
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        working-directory: .work/MaaCore
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\package-sdk.ps1 `
            -Version "${{ steps.version.outputs.value }}" `
            -AssetVersion nightly `
            -Config RelWithDebInfo `
            -OutputDir "$env:GITHUB_WORKSPACE\dist"

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MaaCore-nightly
          path: dist/MaaCore-sdk-*
          if-no-files-found: error

      - name: Publish nightly release
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $notes = @"
          Nightly MaaCore SDK from upstream-sync ${{ steps.version.outputs.value }}
          upstream-commit=${{ steps.check.outputs.upstream }}
          maa-utils-commit=${{ steps.check.outputs.maaUtils }}
          build-commit=${{ steps.check.outputs.buildCommit }}
          "@
          gh release view nightly 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create nightly --prerelease --title "MaaCore Nightly" --notes $notes
          }
          else {
            gh release edit nightly --prerelease --title "MaaCore Nightly" --notes $notes
          }
          $assets = @(Get-ChildItem -Path dist -File -Filter "MaaCore-sdk-*.7z" | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No nightly SDK assets found in dist/" }
          & gh release upload nightly --clobber @assets
