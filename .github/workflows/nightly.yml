name: Nightly MaaCore SDK

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "MaaCore upstream ref (default: upstream-sync)"
        required: false
        default: upstream-sync
        type: string

permissions:
  contents: write

jobs:
  nightly:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      MAA_REF: ${{ inputs.ref || 'upstream-sync' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Ensure 7-Zip
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-nightly-${{ runner.os }}-${{ hashFiles('overlay/**', 'MaaUtils/**', 'include/**', 'cmake/**', 'tools/**', '.github/workflows/nightly.yml') }}
          restore-keys: |
            sccache-nightly-${{ runner.os }}-

      - name: Cache prebuilt dependencies
        uses: actions/cache@v4
        with:
          path: .work/MaaCore/deps
          key: maacore-deps-${{ runner.os }}-${{ hashFiles('tools/deps-versions.json', 'tools/fastdeploy-manifest.json', 'tools/build-upstream-deps.ps1', 'tools/fetch-deps.ps1', 'overlay/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            maacore-deps-${{ runner.os }}-

      - name: Cache upstream downloads
        uses: actions/cache@v4
        with:
          path: .work/MaaCore/.bootstrap
          key: upstream-deps-downloads-${{ runner.os }}-${{ hashFiles('tools/build-upstream-deps.ps1', 'tools/deps-versions.json', 'tools/fastdeploy-manifest.json') }}
          restore-keys: |
            upstream-deps-downloads-${{ runner.os }}-

      - name: Prepare upstream source
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\prepare-source.ps1 -Ref "$env:MAA_REF"

      - name: Resolve nightly version
        id: version
        shell: pwsh
        run: |
          $sha = git -C .work/MaaCore rev-parse --short HEAD
          $version = "nightly-$(Get-Date -Format yyyyMMdd)-$sha"
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Nightly version: $version"

      - name: Bootstrap dependencies
        shell: pwsh
        working-directory: .work/MaaCore
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\bootstrap-standalone.ps1

      - name: Build MaaCore
        shell: pwsh
        working-directory: .work/MaaCore
        run: |
          sccache --zero-stats
          powershell -ExecutionPolicy Bypass -File .\tools\build-maacore-only.ps1 `
            -SkipBootstrap -NoFresh -UseSccache -Config RelWithDebInfo `
            -Generator "Ninja Multi-Config" -Parallel ([Environment]::ProcessorCount) `
            -Version "${{ steps.version.outputs.value }}"

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Package nightly SDK
        shell: pwsh
        working-directory: .work/MaaCore
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\package-sdk.ps1 `
            -Version "${{ steps.version.outputs.value }}" `
            -AssetVersion nightly `
            -Config RelWithDebInfo `
            -OutputDir "$env:GITHUB_WORKSPACE\dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaaCore-nightly
          path: dist/MaaCore-sdk-*
          if-no-files-found: error

      - name: Publish nightly release
        shell: pwsh
        run: |
          $notes = "Nightly MaaCore SDK from upstream-sync ${{ steps.version.outputs.value }}"
          gh release view nightly 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create nightly --prerelease --title "MaaCore Nightly" --notes $notes
          }
          else {
            gh release edit nightly --prerelease --title "MaaCore Nightly" --notes $notes
          }
          $assets = @(Get-ChildItem -Path dist -File -Filter "MaaCore-sdk-*.7z" | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No nightly SDK assets found in dist/" }
          & gh release upload nightly --clobber @assets
