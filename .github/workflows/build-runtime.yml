name: Build runtime bundle

# Rebuild the client-facing runtime DLL bundle. Needed whenever a runtime
# dependency changes, e.g. the FastDeploy DLL gains new exports.

on:
  workflow_dispatch:
    inputs:
      bundleVersion:
        description: "Bundle version, e.g. v2 (bump when a runtime DLL changes)"
        required: true
        default: v2
        type: string
  push:
    tags:
      - "runtime-v*"

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve bundle version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.bundleVersion }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}" -replace '^runtime-', ''
            }
            else {
              $version = "v2"
            }
          }
          $version = $version.Trim()
          if ($version -notmatch '^v[0-9]+$') {
            throw "Invalid bundle version '$version'; expected something like v2."
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Bundle version: $version"

      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            .bootstrap/deps
            .bootstrap/upstream-deps
          key: runtime-deps-${{ runner.os }}-${{ hashFiles('tools/deps-versions.json', 'tools/fastdeploy-manifest.json', 'tools/build-libs-manifest.json', 'tools/fetch-deps.ps1', 'tools/build-upstream-deps.ps1') }}
          restore-keys: |
            runtime-deps-${{ runner.os }}-

      - name: Assemble dependencies
        shell: pwsh
        run: |
          .\tools\fetch-deps.ps1 -RepoRoot "$env:GITHUB_WORKSPACE" -ReleaseOnly

      - name: Pack runtime bundle
        shell: pwsh
        run: |
          .\tools\pack-runtime.ps1 `
            -RuntimeDir "$env:GITHUB_WORKSPACE\deps\runtime\maa-x64-windows" `
            -BundleVersion "${{ steps.version.outputs.value }}" `
            -OutputDir "$env:GITHUB_WORKSPACE\dist" `
            -UpdateManifest

      - name: Publish release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "runtime-$version"
          $asset = Get-ChildItem -Path dist -File -Filter "MaaCore-runtime-*.zip" | Select-Object -First 1
          if ($null -eq $asset) { throw "No runtime asset found in dist/" }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "MaaCore Runtime $version" --notes "Unified runtime DLL bundle for MaaCore SDK."
          }
          gh release upload $tag $asset.FullName --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ steps.version.outputs.value }}
          path: |
            dist/MaaCore-runtime-*.zip
            tools/runtime-manifest.json
          if-no-files-found: error

      - name: Summary
        shell: pwsh
        run: |
          Write-Host "Published runtime-${{ steps.version.outputs.value }}."
          Write-Host "Commit tools/runtime-manifest.json so package-sdk uses it."
          Get-Content tools/runtime-manifest.json
